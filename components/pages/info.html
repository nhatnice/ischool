    <script>
      $(document).ready(function(){
        var ver = '<h5 style="font-weight:300;font-size:36px">BẠN ĐANG Ở PHIÊN BẢN {VERSION}</h5>'
        + '<h5 style="font-weight:300;font-size:24px">Copyright © 2018 - {YEAR} Lavensoft</h5>'
        fs.readFile("./info.json", (err, data) => {
		data = JSON.parse(data);
        if (err) {
          console.error(err)
        } else {
          var d = new Date();
          d = d.getFullYear();
          ver = ver.replace("{VERSION}",data.ver);
          ver = ver.replace("{YEAR}",d);
        }
        $("#txtw").append(ver);
      });

        $("#btnw").click(function(){
          sidebarItem("student");
        });
        $("#imgw").fadeIn(1500);
        $("#txtw").show(1500);
      });
