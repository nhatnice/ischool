<html>
  <head>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/materialize.css" />
    <script type="text/javascript" src="./js/hamer.min.js"></script>
  <script src="./js/materialize.min.js" type="text/javascript"></script>
    <script>window.$ = window.jQuery = require('./js/jquery-3.3.1.min.js')</script>
    <script src="./js/jquery-ui.min.js" type="text/javascript"></script>
    <script type="text/javascript" src="./js/script.js"></script>
    <script type="text/javascript" src="./js/sidebar.js"></script>
  </head>
  <body style="margin:0;font-family: 'Roboto', sans-serif;background-color:#fff">
    <form name="formaddm" class="cform">
      <div style="text-align:center;padding-bottom:10px;">
        <h4>Thêm Khoản Thu</h4>
      </div>
      <div class="input-field col s12">
          <i class="material-icons prefix">account_circle</i>
          <input id="icon_prefix" name="names" type="text" class="validate" />
          <label for="icon_prefix">Họ Tên Học Sinh</label>
        </div>
          <div class="input-field col s12">
              <i class="material-icons prefix">&#xE86E;</i>
              <input id="icon_prefix" name="class" type="text" class="validate" />
              <label for="icon_prefix">Lớp</label>
            </div>
          <div class="input-field col s12">
              <i class="material-icons prefix">&#xE916;</i>
              <input id="icon_prefix" name="birthday" type="date" class="validate">
              <label for="icon_prefix"></label>
            </div>
            <div class="input-field col s12">
              <i class="material-icons prefix">attach_money</i>
              <input id="icon_prefix" name="hocphi" type="text" class="validate">
              <label for="icon_prefix">Học Phí</label>
            </div>
                <div class="input-field col s12">
                    <i class="material-icons prefix">cake</i>
                    <input id="icon_prefix" name="an" type="text" class="validate">
                    <label for="icon_prefix">Tiền Ăn</label>
                  </div>
                  <div class="input-field col s12">
                      <i class="material-icons prefix">call_made</i>
                      <input id="icon_prefix" name="khoangkhac" type="text" class="validate">
                      <label for="icon_prefix">Khoản Khác</label>
                    </div>
                      <div class="input-field col s12">
                          <i class="material-icons prefix">note</i>
                           <textarea id="textarea1" name="note" class="materialize-textarea"></textarea>
                          <label for="icon_prefix">Ghi Chú</label>
                        </div>
                        <select name="gt" class="browser-default">
                            <option value="" disabled selected>Tình Trạng</option>
                              <option value="1">Đã Thu</option>
                              <option value="2">Chưa Thu</option>
                            </select>
                      <div class="input-field col s12">
                      <div style="width:100%;margin:auto;height:65px;">
                      <a class="btn waves-effect waves-light" id="submit" style="float:right">Áp Dụng
                        <i class="material-icons right">send</i>
                      </a>
                      <button  class="btn waves-effect waves-light" id="cancel" style="float:right;margin-right:10px;background-color:#ee6e73">Hủy
                        <i class="material-icons right" >close</i>
                      </button>
                      <script>
                        const remote = require('@electron/remote');
                        $("#cancel").click(function(){
                          var window = remote.getCurrentWindow();
                          window.close();
                        });
                      </script>

                    </div>
    </form>
    <script>
      $("#submit").click(function(){
        //var nsame, lop, birthday, code, noisinh, gt, tongiao, dtoc, home, quequan, fnam,fnum, fjob, mname, mnum, mjob = "";
        console.log("subclick");
        var names = document.forms["formaddm"]["names"].value;
        var lop = document.forms["formaddm"]["class"].value;
        var birthday = document.forms["formaddm"]["birthday"].value;
        var hocphi = document.forms["formaddm"]["hocphi"].value;
        var an = document.forms["formaddm"]["an"].value;
        var khoangkhac = document.forms["formaddm"]["khoangkhac"].value;
        var note = document.forms["formaddm"]["note"].value;
        var gt = document.forms["formaddm"]["gt"].value;
    //    var minNumber = 100000;
    //    var maxNumber = 999999;
    //    var rand = Math.floor(Math.random()*(max-min+1)+min);

      var kkdata = [{
        name: names,
        lops: lop,
        ngaysinh: birthday,
        hocphis: hocphi,
        ans: an,
        khoangkhacs: khoangkhac,
        notes: note,
        gts: gt
      }];
      var path = require("path");
      var filePath = "./kkdata.json";
        const storage = require('electron-storage');
      storage.isPathExists(filePath)
      .then(itDoes => {
        if (itDoes) {
          var stodata;
          storage.get(filePath)
              .then(stodata => {
              stodata = kkdata.concat(stodata);
              storage.set(filePath, stodata)
                .then(data => {
                  console.log(stodata);
                  window.close();
                })
                .catch(err => {
                  console.error(err);
                });
              })
              .catch(err => {
                console.error(err);
              });
        }else{
          storage.set(filePath, kkdata)
            .then(data => {
              console.log(kkdata);
                  window.close();
            })
            .catch(err => {
              console.error(err);
            });
        }
      });


        });
    </script>
  </body>
</html>
