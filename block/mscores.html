    addmWindow.loadURL('file://'+__dirname+'/components/pages/addScores.html');
  //   addmWindow.setAlwaysOnTop(true, "floating", 1);
     addmWindow.setVisibleOnAllWorkspaces(false);
   });

   //REFRESH page
   $("#refresh").click(function(){
     refresh("#content","./components/pages/scores.html");
   });
</script>
